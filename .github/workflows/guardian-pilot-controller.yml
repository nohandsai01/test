name: guardian-pilot-controller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  tests-controller:
    name: guardian-pilot-tests
    runs-on: ubuntu-latest
    steps:
      - name: Attest exact-head worker tests
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ github.token }}
          script: |
            const workerName = 'guardian-pilot-worker-tests';
            const workerPath = '.github/workflows/guardian-pilot-tests.yml';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.head.repo.full_name !== `${owner}/${repo}`) { core.setFailed('WORKER_HEAD_REPOSITORY_MISMATCH'); return; }
            const baseSha = pr.base.sha;
            const headSha = pr.head.sha;
            async function workflowSha(ref) {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: workerPath, ref });
              if (Array.isArray(data) || !data.sha) throw new Error('WORKER_WORKFLOW_BLOB_MISSING');
              return data.sha;
            }
            const [baseBlob, headBlob] = await Promise.all([workflowSha(baseSha), workflowSha(headSha)]);
            if (baseBlob !== headBlob) { core.setFailed('WORKER_WORKFLOW_CHANGED_BY_CANDIDATE'); return; }
            for (let attempt = 0; attempt < 40; attempt += 1) {
              const { data } = await github.rest.checks.listForRef({ owner, repo, ref: headSha, filter: 'latest', per_page: 100 });
              const runs = data.check_runs.filter(r => r.name === workerName && r.head_sha === headSha).sort((a,b) => b.id-a.id);
              if (runs.length) {
                const check = runs[0];
                if (check.status === 'completed' && check.conclusion !== 'success') { core.setFailed('WORKER_CHECK_NOT_SUCCESS'); return; }
                if (check.status === 'completed' && check.conclusion === 'success') {
                  const m = String(check.details_url || '').match(/\/actions\/runs\/(\d+)/);
                  if (!m) { core.setFailed('WORKER_RUN_ID_MISSING'); return; }
                  const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(m[1]) });
                  if (run.event !== 'pull_request' || run.head_sha !== headSha || run.path !== workerPath) { core.setFailed('WORKER_RUN_BINDING_MISMATCH'); return; }
                  core.info(`TRUSTED_WORKER_RUN_ID=${run.id}`);
                  core.info(`TRUSTED_WORKER_HEAD_SHA=${headSha}`);
                  return;
                }
              }
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            core.setFailed('WORKER_CHECK_TIMEOUT');

  ci-controller:
    name: guardian-pilot-ci
    runs-on: ubuntu-latest
    steps:
      - name: Attest exact-head worker CI
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ github.token }}
          script: |
            const workerName = 'guardian-pilot-worker-ci';
            const workerPath = '.github/workflows/guardian-pilot-ci.yml';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.head.repo.full_name !== `${owner}/${repo}`) { core.setFailed('WORKER_HEAD_REPOSITORY_MISMATCH'); return; }
            const baseSha = pr.base.sha;
            const headSha = pr.head.sha;
            async function workflowSha(ref) {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: workerPath, ref });
              if (Array.isArray(data) || !data.sha) throw new Error('WORKER_WORKFLOW_BLOB_MISSING');
              return data.sha;
            }
            const [baseBlob, headBlob] = await Promise.all([workflowSha(baseSha), workflowSha(headSha)]);
            if (baseBlob !== headBlob) { core.setFailed('WORKER_WORKFLOW_CHANGED_BY_CANDIDATE'); return; }
            for (let attempt = 0; attempt < 40; attempt += 1) {
              const { data } = await github.rest.checks.listForRef({ owner, repo, ref: headSha, filter: 'latest', per_page: 100 });
              const runs = data.check_runs.filter(r => r.name === workerName && r.head_sha === headSha).sort((a,b) => b.id-a.id);
              if (runs.length) {
                const check = runs[0];
                if (check.status === 'completed' && check.conclusion !== 'success') { core.setFailed('WORKER_CHECK_NOT_SUCCESS'); return; }
                if (check.status === 'completed' && check.conclusion === 'success') {
                  const m = String(check.details_url || '').match(/\/actions\/runs\/(\d+)/);
                  if (!m) { core.setFailed('WORKER_RUN_ID_MISSING'); return; }
                  const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(m[1]) });
                  if (run.event !== 'pull_request' || run.head_sha !== headSha || run.path !== workerPath) { core.setFailed('WORKER_RUN_BINDING_MISMATCH'); return; }
                  core.info(`TRUSTED_WORKER_RUN_ID=${run.id}`);
                  core.info(`TRUSTED_WORKER_HEAD_SHA=${headSha}`);
                  return;
                }
              }
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            core.setFailed('WORKER_CHECK_TIMEOUT');
